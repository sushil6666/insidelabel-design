[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insidelabel"
version = "0.1.0"
description = "Ingredient label analysis and validation engine"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "google-genai",
    "Pillow",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# pgserver: embedded Postgres 16 for tests, no install or sudo needed (lacks pg_trgm).
dev = ["pytest", "httpx", "pgserver"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
